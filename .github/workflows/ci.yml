name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src
      - run: for file in site/*.js; do node --check "$file"; done
      - run: node tests/test_geo.js
      - run: PYTHONPATH=src python -m blindspot build
      - run: PYTHONPATH=src python -m blindspot model
      - run: PYTHONPATH=src python -m blindspot analyze
      - run: PYTHONPATH=src python -m blindspot validate
      - run: PYTHONPATH=src python -m blindspot export
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify generated data is current
        run: git diff --exit-code -- data/current/analysis.json data/current/model.json site/assets/data
