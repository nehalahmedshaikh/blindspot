name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: node --check site/app.js
      - run: node --check site/geo.js
      - run: node tests/test_geo.js
      - run: PYTHONPATH=src python -m blindspot build
      - run: PYTHONPATH=src python -m blindspot validate
